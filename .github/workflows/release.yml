name: Release ITUMiniTwit

on:
  push:
    branches: [ main ]
    tags:
      - "v*"    # Kører kun på tags som v1.0.0
  pull_request:
    branches: [ main ]
  workflow_dispatch:


jobs:
  release:
    permissions:
      security-events: write
      contents: read
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore dependencies
        run: dotnet restore
      
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4

      - name: Build via .NET
        run: dotnet build src/ITUMiniTwit.Web --configuration Release
      
      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4
        
      - name: Publish WebApp
        run: dotnet publish src/ITUMiniTwit.Web/ITUMiniTwit.Web.csproj -c Release -o ${{env.DOTNET_ROOT}}/webapp

      - name: Upload WebApp artifact
        uses: actions/upload-artifact@v4
        with:
          name: net-app
          path: ${{env.DOTNET_ROOT}}/webapp

      - name: Publish executables
        run: |
          # Linux (x64)
          dotnet publish src/ITUMiniTwit.Web/ITUMiniTwit.Web.csproj -c Release -r linux-x64 --self-contained false -p:PublishSingleFile=true -o publish/linux-x64
          zip -j ITUMiniTwit-linux-x64.zip publish/linux-x64/*

      - name: Publish executables
        run: |
          # Windows (x64)
          dotnet publish src/ITUMiniTwit.Web/ITUMiniTwit.Web.csproj -c Release -r win-x64 --self-contained false -p:PublishSingleFile=true -o publish/win-x64
          zip -j ITUMiniTwit-win-x64.zip publish/win-x64/*
          
      - name: Publish executables
        run: |
          # macOS (x64)
          dotnet publish src/ITUMiniTwit.Web/ITUMiniTwit.Web.csproj -c Release -r osx-x64 --self-contained false -p:PublishSingleFile=true -o publish/osx-x64
          zip -j ITUMiniTwit-osx-x64.zip publish/osx-x64/*

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ITUMiniTwit-linux-x64.zip
            ITUMiniTwit-win-x64.zip
            ITUMiniTwit-osx-x64.zip
        env:
          GITHUB_TOKEN: ${{ secrets.Hemmelighed }}
  
  # new deploy workflow here:
  deploy-docker:
    runs-on: ubuntu-latest
    needs: release #Needs the release to finish successfuly - dotnet build, dotnet restore and dotnet publish
    steps:
      - name: Checkout 
        uses: actions/checkout@v4 #Checks out the code from the repository and makes it available for the following steps. 

      - name: Login to Docker Hub
        uses: docker/login-action@v3 #Logs into Docker Hub --> Necessary to push the built image to Docker Hub
        with:
          username: ${{secrets.DOCKER_USERNAME}}
          password: ${{secrets.DOCKER_PASSWORD}}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3 #Makes it possible to build images for different platforms like linux, windows and macOS.

      - name: Build and push ITUMiniTwit
        uses: docker/build-push-action@v6 #This uses the buildx setup from the previous step, to build the docker image based
        with:                             # on the Dockerfile and then it pushes the built image to the Docker Hub repository.
          file: Docker/Web/Dockerfile
          context: .
          push: true
          tags: ${{secrets.DOCKER_USERNAME}}/minitwit
      
      # Add following step to copy docker-compose file into VM in order to avoid running Terraform.tf
      # https://github.com/appleboy/scp-action
      - name: Upload docker-compose
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          source: docker-compose.yml
          target: /root
        
      - name: Upload config.alloy file
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          source: alloy/config.alloy
          target: /root/alloy/config.alloy
      
      - name: Upload loki-config.yml file
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          source: loki/loki-config.yml
          target: /root/loki/loki-config.yml
          

        # Creating .env file via SSH to VM in order to use environment variables for database etc.
      - name: Create .env file
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            cat << EOF > /root/.env
            MYSQL_ROOT_PASSWORD=${{ secrets.MYSQL_ROOT_PASSWORD }}
            MYSQL_USER=${{ secrets.MYSQL_USER }}
            MYSQL_PASSWORD=${{ secrets.MYSQL_PASSWORD }}
            MYSQL_DATABASE=${{ secrets.MYSQL_DATABASE }}
            DOCKER_USERNAME=${{ secrets.DOCKER_USERNAME }}
            EOF

        # https://github.com/appleboy/ssh-action?tab=readme-ov-file#-core-concepts--input-parameters
      - name: Deploy to Droplet
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            cd /root
            docker compose pull
            docker compose up -d
