name: Convert report to pdf

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Convert report
        uses: baileyjm02/markdown-to-pdf@1be26775add5f94fb55d4a2ce36ff7cad23b8dd0
        with:
          input_path: report/report.md
          output_dir: report/build
          images_dir: report/Images
          build_html: false

      - name: Rename and commit PDF
        run: |
          mv report/build/report.pdf report/build/BSc_group_a.pdf
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add report/build/BSc_group_a.pdf
          git diff --cached --quiet || git commit -m "Generate report PDF"
          git push
