name: Linting and code formatting

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet$v4
        with:
          dotnet-version: 9.0.x

      - name: dotnet format
        run: dotnet format --verify-no-changes